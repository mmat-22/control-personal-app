<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Gastos</title>

  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <main class="app">

    <header class="header">
      <h1>💰 Mis Finanzas</h1>
      <p>Resumen actualizado de ingresos, gastos y saldo.</p>
    </header>

    <a class="boton" href="index.html">➕ Agregar Movimiento</a>

    <section class="resumen">
      <div class="card">
        <span>Ingresos</span>
        <strong class="valor ingresos" id="totalIngresos">$0</strong>
      </div>

      <div class="card">
        <span>Gastos</span>
        <strong class="valor gastos" id="totalGastos">$0</strong>
      </div>

      <div class="card">
        <span>Saldo</span>
        <strong class="valor saldo" id="saldo">$0</strong>
      </div>
    </section>

    <section class="card">
      <h2>Distribución</h2>
      <div class="grafico-contenedor">
        <canvas id="grafico"></canvas>
      </div>
    </section>

    <section class="card">
      <div class="titulo-linea">
        <h2>Últimos movimientos</h2>
        <small id="ultimaActualizacion">Actualizando...</small>
      </div>

      <div id="movimientos"></div>
    </section>

  </main>

<script>
const URL = "https://script.google.com/macros/s/AKfycbzekVMi8lJn-ZttNiDcwel0GmyEOi0iCZ2ZVDnkGBVngvgSOY32Q7zrNABMt4kkTfza/exec?accion=gastos";

let grafico = null;

function formatearPesos(valor){
  return "$" + Number(valor || 0).toLocaleString("es-AR", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  });
}

function convertirFecha(fecha){
  const f = new Date(fecha);
  return isNaN(f) ? new Date(0) : f;
}

function formatearFecha(fecha){
  const f = new Date(fecha);

  if(isNaN(f)){
    return fecha || "";
  }

  return f.toLocaleString("es-AR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

async function cargarDatos(){

  try{
    const res = await fetch(URL + "&t=" + new Date().getTime(), {
      cache: "no-store"
    });

    const data = await res.json();

    const gastos = data.gastos || [];
    const ingresos = data.ingresos || [];

    let totalGastos = 0;
    let totalIngresos = 0;

    const lista = [];

    for(let i = 1; i < gastos.length; i++){
      const fila = gastos[i];
      if(!fila || fila.length < 5) continue;

      const fecha = fila[0];
      const categoria = fila[2] || "Gasto";
      const descripcion = fila[3] || "Sin descripción";
      const monto = Number(fila[4]) || 0;

      if(monto <= 0) continue;

      totalGastos += monto;

      lista.push({
        tipo: "Gasto",
        categoria,
        fecha,
        descripcion,
        monto
      });
    }

    for(let i = 1; i < ingresos.length; i++){
      const fila = ingresos[i];
      if(!fila || fila.length < 5) continue;

      const fecha = fila[0];
      const categoria = fila[2] || "Ingreso";
      const descripcion = fila[3] || "Sin descripción";
      const monto = Number(fila[4]) || 0;

      if(monto <= 0) continue;

      totalIngresos += monto;

      lista.push({
        tipo: "Ingreso",
        categoria,
        fecha,
        descripcion,
        monto
      });
    }

    document.getElementById("totalIngresos").textContent = formatearPesos(totalIngresos);
    document.getElementById("totalGastos").textContent = formatearPesos(totalGastos);
    document.getElementById("saldo").textContent = formatearPesos(totalIngresos - totalGastos);

    lista.sort((a, b) => convertirFecha(b.fecha) - convertirFecha(a.fecha));

    const movimientos = document.getElementById("movimientos");
    movimientos.innerHTML = "";

    lista.slice(0, 20).forEach(m => {
      const clase = m.tipo === "Ingreso" ? "mov-ingreso" : "mov-gasto";
      const signo = m.tipo === "Ingreso" ? "+" : "-";

      movimientos.innerHTML += `
        <article class="movimiento">
          <div>
            <strong>${m.descripcion}</strong>
            <span>${m.categoria} · ${formatearFecha(m.fecha)}</span>
          </div>
          <div class="${clase}">
            ${signo}${formatearPesos(m.monto)}
          </div>
        </article>
      `;
    });

    if(grafico){
      grafico.destroy();
    }

    grafico = new Chart(document.getElementById("grafico"),{
      type: "doughnut",
      data: {
        labels: ["Gastos", "Ingresos"],
        datasets: [{
          data: [totalGastos, totalIngresos]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });

    document.getElementById("ultimaActualizacion").textContent =
      "Actualizado " + new Date().toLocaleTimeString("es-AR", {
        hour: "2-digit",
        minute: "2-digit"
      });

  }catch(error){
    document.getElementById("ultimaActualizacion").textContent =
      "Error al actualizar";
    console.error(error);
  }
}

cargarDatos();
setInterval(cargarDatos, 30000);
</script>

</body>
</html>
