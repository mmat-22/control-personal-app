<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mis Finanzas</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="stylesheet" href="dashboard.css">

<meta name="theme-color" content="#0d47a1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<main class="app">

<header class="topbar">

<div class="brand">
<img src="icon-512.png">

<div>
<h1>Mis Finanzas</h1>
<p>Dashboard personal</p>
</div>
</div>

<a class="menu-btn" href="index.html">+</a>

</header>

<section class="toolbar">

<label>Mes</label>

<select id="filtroMes"></select>

<small id="ultimaActualizacion">
Actualizando...
</small>

</section>

<section class="resumen-grid">

<article class="metric-card">
<span>Ingresos</span>
<strong class="ingresos" id="totalIngresos">$0</strong>
</article>

<article class="metric-card">
<span>Gastos</span>
<strong class="gastos" id="totalGastos">$0</strong>
</article>

<article class="metric-card">
<span>Saldo</span>
<strong class="saldo" id="saldo">$0</strong>
</article>

</section>

<section class="card">

<h2>Distribución mensual</h2>

<div class="grafico-contenedor">
<canvas id="grafico"></canvas>
</div>

</section>

<section class="card">

<h2>Últimos movimientos</h2>

<div id="movimientos"></div>

</section>

</main>

<script>

const URL = "https://script.google.com/macros/s/AKfycbzekVMi8lJn-ZttNiDcwel0GmyEOi0iCZ2ZVDnkGBVngvgSOY32Q7zrNABMt4kkTfza/exec?accion=gastos";

let grafico = null;

let todosLosMovimientos = [];

function formatearPesos(valor){

return "$" + Number(valor || 0).toLocaleString("es-AR");

}

function convertirFecha(fecha){

const f = new Date(fecha);

if(!isNaN(f)) return f;

return new Date(0);

}

function claveMes(fecha){

const f = convertirFecha(fecha);

return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}`;

}

function nombreMes(clave){

const [anio,mes] = clave.split("-");

const fecha = new Date(anio, mes-1, 1);

return fecha.toLocaleDateString("es-AR",{
month:"long",
year:"numeric"
});

}

function formatearFecha(fecha){

const f = convertirFecha(fecha);

return f.toLocaleDateString("es-AR");

}

function cargarFiltroMeses(){

const select = document.getElementById("filtroMes");

const meses = [...new Set(
todosLosMovimientos.map(m => claveMes(m.fecha))
)].sort().reverse();

const actual = select.value;

select.innerHTML = "";

meses.forEach(mes => {

const option = document.createElement("option");

option.value = mes;

option.textContent = nombreMes(mes);

select.appendChild(option);

});

if(actual && meses.includes(actual)){
select.value = actual;
}else{
select.value = meses[0];
}
}

function renderDashboard(){

const mes = document.getElementById("filtroMes").value;

const movimientosMes = todosLosMovimientos.filter(
m => claveMes(m.fecha) === mes
);

let totalGastos = 0;
let totalIngresos = 0;

movimientosMes.forEach(m => {

if(m.tipo === "Ingreso"){
totalIngresos += m.monto;
}else{
totalGastos += m.monto;
}

});

document.getElementById("totalIngresos").textContent =
formatearPesos(totalIngresos);

document.getElementById("totalGastos").textContent =
formatearPesos(totalGastos);

document.getElementById("saldo").textContent =
formatearPesos(totalIngresos-totalGastos);

const movimientos = document.getElementById("movimientos");

movimientos.innerHTML = "";

movimientosMes
.sort((a,b)=>convertirFecha(b.fecha)-convertirFecha(a.fecha))
.slice(0,25)
.forEach(m => {

const clase =
m.tipo === "Ingreso"
? "mov-ingreso"
: "mov-gasto";

const signo =
m.tipo === "Ingreso"
? "+"
: "-";

movimientos.innerHTML += `

<article class="movimiento">

<div class="mov-info">

<strong>${m.descripcion}</strong>

<span>
${m.categoria} · ${formatearFecha(m.fecha)}
</span>

</div>

<div class="mov-derecha">

<div class="${clase}">
${signo}${formatearPesos(m.monto)}
</div>

<button
class="btn-borrar"
onclick="borrarMovimiento('${m.tipo}', ${m.fila}, '${m.descripcion.replace(/'/g, "\\'")}')"
>
🗑️
</button>

</div>

</article>

`;

});

if(grafico){
grafico.destroy();
}

grafico = new Chart(document.getElementById("grafico"),{

type:"doughnut",

data:{
labels:["Gastos","Ingresos"],
datasets:[{
data:[totalGastos,totalIngresos]
}]
}

});

}

async function borrarMovimiento(tipo,fila,descripcion){

const confirmar = confirm(
`¿Borrar movimiento?\n\n${descripcion}`
);

if(!confirmar) return;

await fetch(
URL.replace("?accion=gastos",""),
{
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"datos="+encodeURIComponent(JSON.stringify({
accion:"borrar",
tipo,
fila
}))
}
);

setTimeout(cargarDatos,1000);

}

async function cargarDatos(){

try{

const res = await fetch(
URL + "&t=" + new Date().getTime(),
{
cache:"no-store"
}
);

const data = await res.json();

todosLosMovimientos = [];

const gastos = data.gastos || [];
const ingresos = data.ingresos || [];

for(let i=1;i<gastos.length;i++){

const fila = gastos[i];

if(!fila || fila.length < 6) continue;

const monto = Number(fila[4]) || 0;

todosLosMovimientos.push({
tipo:"Gasto",
fecha:fila[0],
categoria:fila[2],
descripcion:fila[3],
monto,
fila:fila[5]
});

}

for(let i=1;i<ingresos.length;i++){

const fila = ingresos[i];

if(!fila || fila.length < 6) continue;

const monto = Number(fila[4]) || 0;

todosLosMovimientos.push({
tipo:"Ingreso",
fecha:fila[0],
categoria:fila[2],
descripcion:fila[3],
monto,
fila:fila[5]
});

}

cargarFiltroMeses();

renderDashboard();

document.getElementById("ultimaActualizacion").textContent =
"Actualizado " + new Date().toLocaleTimeString("es-AR");

}catch(error){

console.error(error);

}

}

document
.getElementById("filtroMes")
.addEventListener("change", renderDashboard);

cargarDatos();

setInterval(cargarDatos,30000);

if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
